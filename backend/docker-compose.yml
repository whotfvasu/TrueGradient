version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: truegradient_postgres
    environment:
      POSTGRES_USER: truegradient_user
      POSTGRES_PASSWORD: truegradient_password
      POSTGRES_DB: truegradient_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
